name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (locked)
        run: npm ci

      - name: Install server dependencies (locked)
        run: npm ci --prefix server

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Typecheck SPA
        run: npx tsc -p tsconfig.json --noEmit

      - name: Run tests
        run: npm test

      - name: Build server
        run: npm run build --prefix server

      - name: Build SPA
        run: npm run build

      # Server has 0 known vulnerabilities (2026-08-08) -- a real gate, blocking.
      # Root/SPA is NOT gated here: its findings are all in Capacitor mobile
      # build tooling (devDependencies never installed on the production
      # server -- deploy.sh does not run npm install at all, and mobile builds
      # happen separately on a Mac per AI_PROJECT_OS/12_TASK_QUEUE.md T9), and
      # `npm audit fix --force` would need a real mobile-build verification
      # this CI runner cannot perform. See docs/platform-standard/risk-register.md.
      - name: Audit server dependencies (production deps only)
        run: npm audit --omit=dev --prefix server
